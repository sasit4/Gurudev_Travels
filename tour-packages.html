<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Explore Gurudev Travels tour packages across Tamil Nadu, Kerala and nearby destinations.">
    <title>Tour Packages | Gurudev Travels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --page: #f5f8fd;
            --surface: #ffffff;
            --surface-soft: #f8fbff;
            --text: #102344;
            --muted: #5d7396;
            --line: #e3ebf6;
            --blue: #247cf0;
            --blue-dark: #0759d7;
            --shadow: 0 12px 32px rgba(28, 70, 130, .09);
            --badge-bg: rgba(255, 255, 255, .96);
            --badge-text: #0759d7;
        }

        html[data-theme="dark"] {
            color-scheme: dark;
            --page: #07111f;
            --surface: #0e1b2d;
            --surface-soft: #12233a;
            --text: #eef5ff;
            --muted: #a7bad6;
            --line: #263b56;
            --blue: #62a5ff;
            --blue-dark: #2e82ff;
            --shadow: 0 14px 35px rgba(0, 0, 0, .24);
            --badge-bg: rgba(7, 17, 31, .93);
            --badge-text: #8fc0ff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: var(--page);
            color: var(--text);
            transition: background .25s, color .25s;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: color-mix(in srgb, var(--surface) 92%, transparent);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(14px);
        }

        .nav {
            width: min(1240px, calc(100% - 36px));
            margin: auto;
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            font-size: 1.08rem;
            font-weight: 800;
            letter-spacing: -.4px;
        }

        .brand span {
            color: var(--blue);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .home-link,
        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 10px 15px;
            background: var(--surface);
            color: var(--text);
            font-weight: 650;
        }

        .theme-toggle {
            width: 44px;
            height: 44px;
            padding: 0;
            font-size: 1.1rem;
        }

        .hero {
            width: min(1240px, calc(100% - 36px));
            margin: 0 auto;
            padding: 56px 0 26px;
            text-align: center;
        }

        .eyebrow {
            color: var(--blue);
            font-size: .78rem;
            letter-spacing: 2px;
            font-weight: 800;
            text-transform: uppercase;
        }

        h1 {
            margin: 12px 0;
            font-size: clamp(2rem, 4.5vw, 3.5rem);
            line-height: 1.1;
            letter-spacing: -1.8px;
        }

        .hero p {
            max-width: 690px;
            margin: 0 auto;
            color: var(--muted);
            line-height: 1.75;
        }

        .toolbar {
            width: min(1240px, calc(100% - 36px));
            margin: 20px auto 30px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .search {
            flex: 1 1 260px;
            max-width: 440px;
        }

        .search input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 13px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--text);
            outline: none;
        }

        .search input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 15%, transparent);
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter {
            border: 1px solid var(--line);
            color: var(--muted);
            background: var(--surface);
            padding: 10px 14px;
            border-radius: 999px;
            font-size: .86rem;
            font-weight: 650;
        }

        .filter.active {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff;
        }

        .packages {
            width: min(1240px, calc(100% - 36px));
            margin: 0 auto 54px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;
        }

        .package-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: var(--shadow);
            min-width: 0;
            transition: transform .2s, box-shadow .2s;
        }

        .package-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 42px rgba(28, 70, 130, .15);
        }

        .photo {
            height: 300px;
            position: relative;
            background: linear-gradient(135deg, #c9e4ff, #6689b8);
            overflow: hidden;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, .12), transparent 42%, rgba(0, 0, 0, .06));
            pointer-events: none;
        }

        .photo-badges {
            position: absolute;
            z-index: 1;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 13px;
            border-radius: 999px;
            background: #079b55;
            color: #fff;
            font-size: .76rem;
            font-weight: 800;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .12);
        }

        .tag.new {
            background: #1267e8;
        }

        .tag.seasonal {
            background: #ed8a00;
        }

        .tag.popular {
            background: #079b55;
        }

        .price-badge {
            display: block;
            min-width: 116px;
            padding: 9px 13px;
            border: 2px solid #2d83ff;
            border-radius: 25px;
            background: var(--badge-bg);
            color: var(--badge-text);
            text-align: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .10);
        }

        .price-badge small {
            display: block;
            font-size: .65rem;
            font-weight: 800;
            letter-spacing: .6px;
        }

        .price-badge strong {
            display: block;
            font-size: 1.25rem;
            margin-top: 2px;
        }

        .card-body {
            padding: 24px 25px 22px;
        }

        .category {
            font-size: .77rem;
            letter-spacing: .7px;
            text-transform: uppercase;
            color: var(--blue);
            font-weight: 800;
        }

        .card-body h2 {
            margin: 12px 0;
            font-size: 1.35rem;
            line-height: 1.3;
            letter-spacing: -.45px;
        }

        .description {
            color: var(--muted);
            line-height: 1.7;
            min-height: 54px;
            margin: 0 0 20px;
            font-size: .94rem;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 13px;
            color: var(--muted);
            font-size: .86rem;
            padding-bottom: 19px;
            border-bottom: 1px solid var(--line);
        }

        .meta span,
        .location {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .meta svg,
        .location svg {
            width: 19px;
            height: 19px;
            color: var(--blue);
            flex: 0 0 auto;
        }

        .card-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-top: 18px;
        }

        .location {
            color: var(--muted);
            font-size: .84rem;
            min-width: 0;
        }

        .location span {
            overflow-wrap: anywhere;
        }

        .explore {
            display: inline-flex;
            flex: 0 0 auto;
            align-items: center;
            gap: 8px;
            border: 1.5px solid var(--blue);
            border-radius: 999px;
            padding: 11px 17px;
            color: var(--blue);
            background: transparent;
            font-weight: 750;
            transition: background .2s, color .2s;
        }

        .explore:hover {
            background: var(--blue);
            color: white;
        }

        .view-all-wrap {
            text-align: center;
            padding: 0 18px 60px;
        }

        .view-all {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, var(--blue-dark), #1269e8);
            color: #fff;
            border: 0;
            border-radius: 999px;
            padding: 16px 30px;
            font-weight: 750;
            box-shadow: 0 9px 20px rgba(36, 124, 240, .22);
        }

        .detail-wrap {
            width: min(1000px, calc(100% - 36px));
            margin: 30px auto 70px;
        }

        .back-btn {
            background: transparent;
            color: var(--blue);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 10px 15px;
            margin-bottom: 18px;
            font-weight: 700;
        }

        .detail-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .detail-hero {
            min-height: 300px;
            position: relative;
            background: #b9d8ef;
        }

        .detail-hero img {
            width: 100%;
            height: 600px;
            object-fit: cover;
            display: block;
            padding: 10px;
            border-radius: 20px;
        }

        .detail-content {
            padding: clamp(22px, 4vw, 40px);
        }

        .detail-content h2 {
            font-size: clamp(1.7rem, 3vw, 2.5rem);
            margin: 10px 0;
        }

        .detail-content>p {
            color: var(--muted);
            line-height: 1.8;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            margin-top: 25px;
        }

        .detail-panel {
            border: 1px solid var(--line);
            background: var(--surface-soft);
            border-radius: 16px;
            padding: 20px;
        }

        .detail-panel h3 {
            margin: 0 0 12px;
            font-size: 1.05rem;
        }

        .detail-panel ul {
            margin: 0;
            padding-left: 20px;
            color: var(--muted);
            line-height: 1.9;
        }

        .detail-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        .book-btn {
            background: var(--blue);
            color: white;
            border: 0;
            border-radius: 999px;
            padding: 13px 20px;
            font-weight: 750;
        }

        .empty {
            grid-column: 1 / -1;
            padding: 40px 20px;
            border: 1px dashed var(--line);
            border-radius: 18px;
            color: var(--muted);
            text-align: center;
        }

        footer {
            text-align: center;
            color: var(--muted);
            padding: 24px 18px;
            border-top: 1px solid var(--line);
            font-size: .85rem;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 980px) {
            .packages {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 340px) {
            .nav {
                width: calc(100% - 28px);
                min-height: 66px;
            }

            .brand {
                font-size: .95rem;
            }

            .home-link {
                padding: 10px 12px;
                font-size: .83rem;
            }

            .hero {
                padding: 38px 0 20px;
            }

            .toolbar {
                margin-top: 14px;
            }

            .packages {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                width: calc(100% - 28px);
                gap: 18px;
            }

            .photo {
                height: 220px;
            }

            .card-body {
                padding: 21px 20px;
            }

            .description {
                min-height: auto;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            .detail-hero img {
                height: 250px;
            }

            .price-badge {
                min-width: 100px;
                padding: 8px 10px;
            }

            .price-badge strong {
                font-size: 1.08rem;
            }

            .tag {
                padding: 8px 10px;
                font-size: .7rem;
            }
        }

        @media (max-width: 370px) {
            .photo-badges {
                top: 10px;
                left: 10px;
                right: 10px;
            }

            .tag {
                font-size: .64rem;
                padding: 7px 8px;
            }

            .price-badge {
                min-width: 88px;
            }

            .card-bottom {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

        const iconClock = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
        const iconPeople = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2z"/><circle cx="18" cy="8" r="3"/><path d="M17 14a6 6 0 0 1 5 6v1h-4v-2a8 8 0 0 0-1-5z"/></svg>';
        const iconPin = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22s8-7.2 8-13a8 8 0 1 0-16 0c0 5.8 8 13 8 13z"/><circle cx="12" cy="9" r="2.5" fill="white"/></svg>';
        const grid = document.getElementById("packageGrid");
        const detailView = document.getElementById("detailView");
        const viewAllWrap = document.getElementById("viewAllWrap");
        const toolbar = document.querySelector(".toolbar");
        const hero = document.querySelector(".hero");
        let activeFilter = "all";
        let query = "";

        function cardTemplate(pkg) {
            return `<article class="package-card">
      <div class="photo">
        <img src="${pkg.image}" alt="${pkg.place} tour destination" loading="lazy" onerror="this.style.display='none'">
        <div class="photo-badges">
          <span class="tag ${pkg.tagType}">${pkg.tagType === "popular" ? "★" : pkg.tagType === "seasonal" ? "☼" : "✦"} ${pkg.tag}</span>
          <span class="price-badge"><small>PACKAGE RATE</small><strong>${pkg.price}</strong></span>
        </div>
      </div>
      <div class="card-body">
        <div class="category">${pkg.category}</div>
        <h2>${pkg.route}</h2>
        <p class="description">${pkg.description}</p>
        <div class="meta"><span>${iconClock}${pkg.duration}</span><span>${iconPeople}${pkg.people}</span></div>
        <div class="card-bottom"><div class="location">${iconPin}<span>${pkg.place}</span></div><button class="explore" type="button" data-open="${pkg.id}">Explore <span aria-hidden="true">→</span></button></div>
      </div>
    </article>`;
        }

        function matchesFilter(pkg) {
            if (activeFilter === "all") return true;
            if (activeFilter === "4+ Days") return Number.parseInt(pkg.days, 10) >= 4;
            return pkg.days === activeFilter;
        }

        function renderPackages() {
            const filtered = packages.filter(pkg => matchesFilter(pkg) && `${pkg.route} ${pkg.place} ${pkg.start} ${pkg.category}`.toLowerCase().includes(query.toLowerCase()));
            grid.innerHTML = filtered.length ? filtered.map(cardTemplate).join("") : '<div class="empty">No packages match your search. Try another destination.</div>';
            grid.hidden = false;
            detailView.hidden = true;
            viewAllWrap.hidden = false;
            toolbar.hidden = false;
            hero.hidden = false;
            document.getElementById("viewAllButton").hidden = false;
            document.querySelectorAll(".filter").forEach(btn => btn.classList.toggle("active", btn.dataset.filter === activeFilter));
            history.replaceState({}, "", location.pathname + location.search);
        }

        function showAllPackages() {
            activeFilter = "all"; query = "";
            document.getElementById("packageSearch").value = "";
            renderPackages();
            document.getElementById("viewAllButton").hidden = true;
            document.getElementById("packagesTop").scrollIntoView({ behavior: "smooth" });
        }

        function showPackage(id, updateUrl = true) {
            const pkg = packages.find(item => item.id === id);
            if (!pkg) { renderPackages(); return; }
            grid.hidden = true; viewAllWrap.hidden = true; toolbar.hidden = true; hero.hidden = true;
            detailView.hidden = false;
            detailView.innerHTML = `
      <button class="back-btn" id="backToPackages" type="button">← All tour packages</button>
      <article class="detail-card">
        <div class="detail-hero"><img src="${pkg.image}" alt="${pkg.place} landscape" onerror="this.style.display='none'"></div>
        <div class="detail-content">
          <div class="category">${pkg.category} · ${pkg.tag}</div>
          <h2>${pkg.route}</h2>
          <p>${pkg.description}</p>
          <div class="meta"><span>${iconClock}${pkg.duration}</span><span>${iconPeople}${pkg.people}</span><span>${iconPin}${pkg.place}</span></div>
          <div class="detail-grid">
            <section class="detail-panel"><h3>Places to Visit</h3><ul>${pkg.places.map(place => `<li>${place}</li>`).join("")}</ul></section>
            <section class="detail-panel"><h3>Suggested Itinerary</h3><ul>${pkg.itinerary.map(day => `<li>${day}</li>`).join("")}</ul></section>
            <section class="detail-panel"><h3>Cab & Travel Facilities</h3><ul><li>Comfortable private cab for your group</li><li>Pickup point and drop point confirmed during booking</li><li>Flexible sightseeing stops based on the agreed plan</li><li>Vehicle type and luggage capacity confirmed before payment</li></ul></section>
            <section class="detail-panel"><h3>Package Rate & Notes</h3><ul><li>Rate: Please contact Gurudev Travels for a quote</li><li>Confirm vehicle, dates, pickup location and passenger count</li><li>Entry tickets, accommodation, parking and special permits are included only if confirmed</li><li>${pkg.notes}</li></ul></section>
          </div>
          <div class="detail-actions"><button class="book-btn" id="bookThisPackage" type="button">Book This Package →</button>
            <button class="back-btn" id="detailAllPackages" type="button">View All Packages</button>
            </div>
        </div>
      </article>`;
            if (updateUrl) history.pushState({ place: id }, "", `${location.pathname}?place=${encodeURIComponent(id)}`);
            document.getElementById("backToPackages").addEventListener("click", showAllPackages);
            document.getElementById("detailAllPackages").addEventListener("click", showAllPackages);
            document.getElementById("bookThisPackage").addEventListener("click", () => {
                // Update this path if your booking section uses a different ID.
                window.location.href = "index.html#booking";
            });
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        document.getElementById("filters").addEventListener("click", event => {
            const button = event.target.closest("[data-filter]");
            if (!button) return;
            activeFilter = button.dataset.filter;
            renderPackages();
        });
        document.getElementById("packageSearch").addEventListener("input", event => {
            query = event.target.value.trim();
            renderPackages();
        });
        grid.addEventListener("click", event => {
            const button = event.target.closest("[data-open]");
            if (button) showPackage(button.dataset.open);
        });
        document.getElementById("viewAllButton").addEventListener("click", showAllPackages);

        const themeToggle = document.getElementById("themeToggle");
        function setTheme(theme) {
            document.documentElement.dataset.theme = theme;
            themeToggle.textContent = theme === "dark" ? "☀" : "☾";
            themeToggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
            themeToggle.title = theme === "dark" ? "Switch to light mode" : "Switch to dark mode";
        }
        const savedTheme = (() => { try { return localStorage.getItem("gurudev-theme"); } catch (_) { return null; } })();
        setTheme(savedTheme === "dark" ? "dark" : "light");
        themeToggle.addEventListener("click", () => {
            const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            setTheme(next);
            try { localStorage.setItem("gurudev-theme", next); } catch (_) { }
        });

        document.getElementById("year").textContent = new Date().getFullYear();
        const initialPlace = new URLSearchParams(location.search).get("place");
        if (initialPlace && packages.some(pkg => pkg.id === initialPlace)) showPackage(initialPlace, false);
        else renderPackages();
    </script>
